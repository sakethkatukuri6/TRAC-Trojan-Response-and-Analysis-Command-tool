# Nginx reverse proxy configuration for TRAC Platform custom domain deployment
# Usage:
#   1. Replace 'trac.example.com' with your actual domain name.
#   2. Place SSL certificates at /etc/ssl/certs/trac.crt and /etc/ssl/private/trac.key.
#   3. Link or copy this file to /etc/nginx/sites-available/trac.conf and enable it.

upstream trac_backend {
    server 127.0.0.1:8088;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name trac.example.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trac.example.com;

    ssl_certificate /etc/ssl/certs/trac.crt;
    ssl_certificate_key /etc/ssl/private/trac.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Client upload cap (100 MiB matching contract max size)
    client_max_body_size 105M;
    client_body_buffer_size 1M;

    # Timeouts for heavy sample uploads and dynamic sandbox polling
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://trac_backend;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Buffering
        proxy_buffering off;
    }
}
