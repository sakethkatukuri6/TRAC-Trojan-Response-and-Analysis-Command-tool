global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "m7-core-api"
    static_configs:
      - targets: ["m7-core-api:8000"]

  - job_name: "m8-ui"
    static_configs:
      - targets: ["m8-ui:8080"]

  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15672"]
