name: TRAC CI & Contract Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  contract-gate:
    name: Contract Schema & Event Validation Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run contract unit tests
        run: |
          python -m unittest discover -s contract/tests -v

      - name: Run CI Module Gate across all modules
        run: |
          python contract/tools/check_all.py --repo-root .

  unit-tests:
    name: Full Platform Unit & Integration Tests (M1 - M8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Comprehensive Test Suite
        run: |
          pytest -v

  security-scan:
    name: Trivy Repository Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          format: "table"
